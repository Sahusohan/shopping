<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Secure identity validation checkpoint node gateway interface for customer profile administration accounts at TinyBotics.">
    <title>Gateway Authentication Matrix — TinyBotics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="watermark-bg"></div>

    <nav class="navbar">
        <a href="index.html" class="nav-logo pixel-text">Tiny<span>Botics</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="nav-auth" id="navAuth"></div>
    </nav>

    <main class="container auth-wrapper">
        <section class="auth-card" aria-label="Identity Authentication System Interface">
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin">Login Protocol</button>
                <button class="auth-tab" id="tabSignup">Register Vector</button>
            </div>

            <form id="formLogin">
                <div class="form-group">
                    <label for="loginEmail">Account Email Identity</label>
                    <input type="email" class="form-control" id="loginEmail" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="loginPassword">System Access Password</label>
                    <input type="password" class="form-control" id="loginPassword" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:12px;">Authenticate Access Signature</button>
            </form>

            <form id="formSignup" style="display:none;">
                <div class="form-group">
                    <label for="signupName">Full Legal Name</label>
                    <input type="text" class="form-control" id="signupName" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="signupEmail">Target Account Email</label>
                    <input type="email" class="form-control" id="signupEmail" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="signupPassword">Secure Access Password Vector</label>
                    <input type="password" class="form-control" id="signupPassword" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:12px;">Initialize Access Vector</button>
            </form>
        </section>
    </main>

    <div class="modal-overlay" id="addressModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" class="pixel-text">SHIPPING VECTOR ASSIGNMENT</h2>
                <p>Register target shipping coordinates to process hardware distribution requirements.</p>
            </div>
            <form id="formAddress">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="shippingName">Consignee Full Identity</label>
                        <input type="text" class="form-control" id="shippingName" required>
                    </div>
                    <div class="form-group">
                        <label for="shippingPhone">Mobile Protocol Number (10 Digits)</label>
                        <input type="tel" class="form-control" id="shippingPhone" pattern="[0-9]{10}" required>
                    </div>
                    <div class="form-group form-grid-full">
                        <label for="shippingEmail">Verification Email Address (Auto-Locked)</label>
                        <input type="email" class="form-control" id="shippingEmail" readonly>
                    </div>
                    <div class="form-group form-grid-full">
                        <label for="shippingStreet">House / Flat / Infrastructure Grid Vector</label>
                        <input type="text" class="form-control" id="shippingStreet" required>
                    </div>
                    <div class="form-group">
                        <label for="shippingCity">Hub City</label>
                        <input type="text" class="form-control" id="shippingCity" required>
                    </div>
                    <div class="form-group">
                        <label for="shippingState">Region / State Protocol</label>
                        <input type="text" class="form-control" id="shippingState" required>
                    </div>
                    <div class="form-group">
                        <label for="shippingPincode">Postal Pincode System (6 Digits)</label>
                        <input type="text" class="form-control" id="shippingPincode" pattern="[0-9]{6}" required>
                    </div>
                    <div class="form-group">
                        <label for="shippingLandmark">Landmark Context Mapping (Optional)</label>
                        <input type="text" class="form-control" id="shippingLandmark">
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:16px; margin-top:30px;">
                    <button type="button" class="btn btn-outline" id="skipAddressBtn">Skip Vector Registration</button>
                    <button type="submit" class="btn btn-primary">Save Logistics Metadata</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-container" id="toastContainer" role="alert"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBPeJZRj48zLkgLziX-AaB--edSS_GfoOU",
            authDomain: "anonymousconfession-19707.firebaseapp.com",
            databaseURL: "https://anonymousconfession-19707-default-rtdb.firebaseio.com",
            projectId: "anonymousconfession-19707",
            storageBucket: "anonymousconfession-19707.firebasestorage.app",
            messagingSenderId: "513711142017",
            appId: "1:513711142017:web:319791913b52aa5b644980"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = 'toast';
            el.innerText = msg;
            container.appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        const tabLogin = document.getElementById('tabLogin');
        const tabSignup = document.getElementById('tabSignup');
        const formLogin = document.getElementById('formLogin');
        const formSignup = document.getElementById('formSignup');

        function toggleTab(mode) {
            if(mode === 'signup') {
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');
                formSignup.style.display = 'block';
                formLogin.style.display = 'none';
            } else {
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');
                formLogin.style.display = 'block';
                formSignup.style.display = 'none';
            }
        }
        tabLogin.addEventListener('click', () => toggleTab('login'));
        tabSignup.addEventListener('click', () => toggleTab('signup'));

        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('tab') === 'signup') toggleTab('signup');

        async function verifyUserMetaRecord(user) {
            try {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if(docSnap.exists() && docSnap.data().address) {
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('shippingName').value = user.displayName || '';
                    document.getElementById('shippingEmail').value = user.email || '';
                    document.getElementById('addressModal').style.display = 'flex';
                }
            } catch(e) { window.location.href = 'index.html'; }
        }

        formLogin.addEventListener('submit', (e) => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value)
                .then((res) => verifyUserMetaRecord(res.user))
                .catch(err => showToast(`System Access Corrupted: ${err.message}`));
        });

        formSignup.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            createUserWithEmailAndPassword(auth, document.getElementById('signupEmail').value, document.getElementById('signupPassword').value)
                .then(async (res) => {
                    await updateProfile(res.user, { displayName: name });
                    await verifyUserMetaRecord(res.user);
                })
                .catch(err => showToast(`Profile Vector Creation Halted: ${err.message}`));
        });

        document.getElementById('formAddress').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if(!user) return;

            const addressObject = {
                name: document.getElementById('shippingName').value,
                phone: document.getElementById('shippingPhone').value,
                street: document.getElementById('shippingStreet').value,
                city: document.getElementById('shippingCity').value,
                state: document.getElementById('shippingState').value,
                pincode: document.getElementById('shippingPincode').value,
                landmark: document.getElementById('shippingLandmark').value
            };

            try {
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    name: user.displayName || addressObject.name,
                    email: user.email,
                    phone: addressObject.phone,
                    address: addressObject,
                    updatedAt: serverTimestamp()
                }, { merge: true });
                window.location.href = 'index.html';
            } catch(err) { showToast("Critical document transaction collision fault."); }
        });

        document.getElementById('skipAddressBtn').addEventListener('click', () => { window.location.href = 'index.html'; });
    </script>
</body>
</html>
